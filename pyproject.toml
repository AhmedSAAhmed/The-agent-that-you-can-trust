[project]
name = "trustdesk"
version = "0.1.0"
description = "A trust layer for AI agents: DIDs, Verifiable Credentials, revocation, scoped delegation and explainable policy."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43",
    "base58>=2.1",
    "jcs>=0.2.1",
    "pyyaml>=6.0",
    "pydantic>=2",
    "gradio>=5.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "huggingface_hub>=0.25"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trustdesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
